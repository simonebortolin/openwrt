name: Build realtek-luna firmware

on:
  push:
    branches:
      - 'zte-f6005-*'
      - 'realtek-luna-*'
      - main
    paths:
      - '.github/workflows/build-realtek-luna.yml'
      - 'target/linux/realtek-luna/**'
      - 'target/linux/gpon-common/**'
      - 'target/linux/eth-common/**'
      - 'package/gpon/**'
      - 'package/kernel/luna-*/**'
  pull_request:
    paths:
      - '.github/workflows/build-realtek-luna.yml'
      - 'target/linux/realtek-luna/**'
      - 'target/linux/gpon-common/**'
      - 'target/linux/eth-common/**'
      - 'package/gpon/**'
      - 'package/kernel/luna-*/**'
  workflow_dispatch:
    inputs:
      device:
        description: 'Single device to build (empty = all taroko devices)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: realtek-luna / taroko
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift
          sudo apt-get -qq autoremove --purge
          sudo apt-get -qq clean

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libelf-dev libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            python3-distutils-extra

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config for realtek-luna/taroko
        run: |
          cat > .config <<'CONF'
          CONFIG_TARGET_realtek-luna=y
          CONFIG_TARGET_realtek-luna_taroko=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y
          CONF

          # If a single device was requested, pin it
          DEVICE="${{ github.event.inputs.device }}"
          if [ -n "$DEVICE" ]; then
            echo "CONFIG_TARGET_DEVICE_realtek-luna_taroko_DEVICE_${DEVICE}=y" >> .config
          else
            echo "CONFIG_TARGET_ALL_PROFILES=y" >> .config
          fi

          make defconfig

      - name: Download sources
        run: make download -j8 V=s || make download -j1 V=s

      - name: Build toolchain
        run: |
          make tools/install -j$(nproc) V=s 2>&1 | tail -20
          make toolchain/install -j$(nproc) V=s 2>&1 | tail -20

      - name: Build firmware
        run: |
          make -j$(nproc) V=s 2>&1 | tee build.log | tail -100
        continue-on-error: true

      - name: Retry build (single thread on failure)
        if: failure()
        run: make -j1 V=s 2>&1 | tail -200

      - name: Collect firmware artifacts
        run: |
          mkdir -p firmware
          cp -v bin/targets/realtek-luna/taroko/*-kernel.bin firmware/ 2>/dev/null || true
          cp -v bin/targets/realtek-luna/taroko/*-rootfs.bin firmware/ 2>/dev/null || true
          cp -v bin/targets/realtek-luna/taroko/*-sysupgrade.bin firmware/ 2>/dev/null || true
          cp -v bin/targets/realtek-luna/taroko/*-initramfs-kernel.bin firmware/ 2>/dev/null || true
          cp -v bin/targets/realtek-luna/taroko/sha256sums firmware/ 2>/dev/null || true
          cp -v bin/targets/realtek-luna/taroko/profiles.json firmware/ 2>/dev/null || true
          ls -lh firmware/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: realtek-luna-taroko-firmware-${{ github.sha }}
          path: firmware/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 7

  release:
    name: Create release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: realtek-luna-taroko-firmware-${{ github.sha }}
          path: firmware/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: firmware/*
          generate_release_notes: true
