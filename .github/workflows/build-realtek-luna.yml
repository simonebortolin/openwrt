# SPDX-License-Identifier: GPL-2.0-only
#
# Compiler validation for the RLX/Lexra "Taroko" core (realtek-luna/taroko).
#
# The Taroko is NOT standard MIPS.  It lacks trap instructions (teq/tne/...),
# has a branch-delay-slot erratum with three-operand mul (990-mips-fix-rlx),
# and an MDU erratum that -fno-schedule-insns2 mitigates.  A binary that
# builds clean and links clean will trap on the device if any of these slip
# through -- which is why the ISA audit and the compiler flag checks are
# build gates (exit non-zero), not reports.
#
# Jobs (most run in parallel):
#   patch-check       the RLX GCC patch still exists and is non-empty
#   build             toolchain + compiler-flag validation + kernel + ISA audit
#
# The full firmware image (packages + rootfs) builds on every run so that
# initramfs images are always available for TFTP bring-up.

name: realtek-luna compiler validation

on:
  push:
    branches:
      - 'zte-f6005-*'
      - 'realtek-luna-*'
      - main
    paths:
      - '.github/workflows/build-realtek-luna.yml'
      - 'toolchain/**'
      - 'tools/**'
      - 'target/linux/realtek-luna/**'
      - 'target/linux/gpon-common/**'
      - 'target/linux/eth-common/**'
      - 'package/gpon/**'
      - 'package/kernel/luna-*/**'
      - 'include/**'
  pull_request:
    paths:
      - '.github/workflows/build-realtek-luna.yml'
      - 'toolchain/**'
      - 'tools/**'
      - 'target/linux/realtek-luna/**'
      - 'target/linux/gpon-common/**'
      - 'target/linux/eth-common/**'
      - 'package/gpon/**'
      - 'package/kernel/luna-*/**'
      - 'include/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes the build of the older one worthless,
# so it is cancelled.  Every other run gets a group of its own (the run id).
concurrency:
  group: rlx-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Does the GCC RLX patch exist?  Seconds, no build, catches a rebase
  # that dropped the patch before the 40-minute toolchain build starts.
  patch-check:
    name: GCC RLX patch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 990-mips-fix-rlx.patch exists and is non-trivial
        run: |
          patch=toolchain/gcc/patches-14.x/990-mips-fix-rlx.patch
          [ -f "$patch" ] || {
            echo "FAIL: $patch missing -- the RLX erratum fix is gone" >&2
            exit 1
          }
          lines=$(wc -l < "$patch")
          [ "$lines" -gt 5 ] || {
            echo "FAIL: $patch is only $lines lines -- truncated?" >&2
            exit 1
          }
          echo "$(head -1 "$patch") ($lines lines)"

      - name: taroko CFLAGS include the three RLX mitigations
        run: |
          mk=target/linux/realtek-luna/taroko/target.mk
          for flag in -mfix-rlx -mdivide-breaks -fno-schedule-insns2; do
            grep -q -- "$flag" "$mk" || {
              echo "FAIL: $flag missing from $mk" >&2
              exit 1
            }
          done
          echo "taroko CFLAGS: $(grep '^CFLAGS' "$mk")"

  # Build the cross-toolchain (the expensive part, cached), validate the
  # compiler flags on small test programs, then build and audit the kernel.
  build:
    name: Toolchain + kernel (taroko)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift
          sudo apt-get -qq autoremove --purge
          sudo apt-get -qq clean

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libelf-dev libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            python3-distutils-extra

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      # The toolchain is the expensive part (~40 min cold).  Cache it
      # keyed on its own sources and the target config: a hit skips the
      # build, a miss rebuilds from scratch.
      - name: Cache toolchain
        id: cache-tc
        uses: actions/cache@v4
        with:
          path: |
            staging_dir/host
            staging_dir/toolchain-*
            build_dir/host
            build_dir/toolchain-*
          key: tc-taroko-${{ runner.os }}-${{ hashFiles('toolchain/**', 'tools/**', 'include/toolchain-build.mk', 'target/linux/realtek-luna/taroko/target.mk') }}

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config for realtek-luna/taroko
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_realtek_luna=y
          CONFIG_TARGET_realtek_luna_taroko=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_ALL_PROFILES=y
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y
          EOF
          make defconfig
          grep -q 'CONFIG_TARGET_realtek_luna=y' .config || {
            echo "FAIL: realtek-luna target not selected after defconfig" >&2
            echo "Active target:" >&2
            grep 'CONFIG_TARGET_BOARD=' .config >&2
            exit 1
          }

      - name: Download sources
        run: make download -j8 V=s || make download -j1 V=s

      # ---- Toolchain ----

      - name: Build host tools
        if: steps.cache-tc.outputs.cache-hit != 'true'
        run: make tools/install -j$(nproc) V=s 2>&1 | tail -20

      - name: Build cross-toolchain
        if: steps.cache-tc.outputs.cache-hit != 'true'
        run: |
          start=$(date +%s)
          make toolchain/install -j$(nproc) V=s 2>&1 | tail -30
          echo "TOOLCHAIN_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      # ---- RLX/Lexra compiler flag validation ----
      # These run right after the toolchain, before the kernel: a broken
      # compiler is caught in seconds instead of after a 30-minute build.

      - name: Find cross-compiler
        id: cc
        run: |
          # The gcc binary may be a symlink or a wrapper script, so do not
          # restrict to -type f.  The tuple is OPTIMIZE_FOR_CPU-openwrt-linux-LIBC.
          CC=$(find staging_dir/toolchain-*/bin -name '*-openwrt-linux-*-gcc' ! -name '*.bak' 2>/dev/null | head -1)
          if [ -z "$CC" ]; then
            echo "cross-gcc not found; contents of staging_dir:" >&2
            ls -R staging_dir/toolchain-*/bin/ 2>&1 | head -40 >&2
            exit 1
          fi
          prefix="${CC%-gcc}"
          OD="${prefix}-objdump"
          [ -e "$OD" ] || { echo "cross-objdump not found at $OD" >&2; exit 1; }
          echo "cc=$CC" >> "$GITHUB_OUTPUT"
          echo "objdump=$OD" >> "$GITHUB_OUTPUT"
          "$CC" --version | head -1

      - name: "Flag check: GCC accepts -mfix-rlx"
        env:
          CC: ${{ steps.cc.outputs.cc }}
        run: |
          echo 'int f(void) { return 0; }' | "$CC" -mfix-rlx -xc - -S -o /dev/null
          echo "OK: -mfix-rlx accepted"

      - name: "Flag check: -mdivide-breaks emits break, not teq"
        env:
          CC: ${{ steps.cc.outputs.cc }}
          OD: ${{ steps.cc.outputs.objdump }}
        run: |
          cat > /tmp/div-test.c <<'C'
          volatile int a = 42, b = 7;
          int main(void) { return a / b; }
          C
          # Compile to .o only — a static link pulls musl, whose abort()
          # legitimately contains teq and would false-positive the check.
          "$CC" -Os -mips32 -mdivide-breaks -c -o /tmp/div-test.o /tmp/div-test.c
          "$OD" -d /tmp/div-test.o > /tmp/div-test.dis

          if grep -qw 'teq' /tmp/div-test.dis; then
            echo "FAIL: teq found — -mdivide-breaks did not replace it" >&2
            grep -n 'teq' /tmp/div-test.dis | head -5
            exit 1
          fi
          if ! grep -q 'break' /tmp/div-test.dis; then
            echo "FAIL: no break instruction for divide-by-zero" >&2
            exit 1
          fi
          echo "OK: divide-by-zero uses break, not teq"

      - name: "Flag check: -mfix-rlx keeps mul out of branch delay slots"
        env:
          CC: ${{ steps.cc.outputs.cc }}
          OD: ${{ steps.cc.outputs.objdump }}
        run: |
          cat > /tmp/rlx-test.c <<'C'
          int test(int a, int b, int c) {
              int r = a * b;
              if (r) return r + c;
              return c;
          }
          int main(void) { return test(3, 4, 5); }
          C
          # Compile to .o only — avoids musl noise in the disassembly.
          "$CC" -O2 -mips32 -mfix-rlx -c -o /tmp/rlx-test.o /tmp/rlx-test.c
          "$OD" -d /tmp/rlx-test.o > /tmp/rlx-test.dis

          # In MIPS disassembly the delay slot is the line right after a
          # branch/jump.  A three-operand mul there is the erratum.
          awk '
            /\tb(ne|eq|gez|gtz|lez|ltz|al)/ || /\tj(|al|r|alr)\t/ {
              is_branch = 1; bline = $0; next
            }
            is_branch && /\tmul\t/ {
              printf "FAIL: mul in delay slot:\n  %s\n  %s\n", bline, $0
              fail = 1
            }
            { is_branch = 0 }
            END { exit fail ? 1 : 0 }
          ' /tmp/rlx-test.dis
          echo "OK: no mul in branch delay slots"

      # ---- Kernel build ----

      - name: Build kernel
        run: |
          start=$(date +%s)
          make target/linux/compile -j$(nproc) V=s 2>&1 | tee /tmp/kernel-build.log | tail -40
          echo "KERNEL_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"

      - name: End of kernel build log
        if: failure()
        run: tail -80 /tmp/kernel-build.log 2>/dev/null || true

      # ---- ISA audit: the build gate ----
      # An instruction this CPU lacks links clean and traps on the device.

      - name: "ISA audit: no trap instructions in vmlinux"
        env:
          OD: ${{ steps.cc.outputs.objdump }}
        run: |
          vmlinux=$(find build_dir/target-*/linux-*/linux-*/ -name vmlinux -type f 2>/dev/null | head -1)
          [ -n "$vmlinux" ] || { echo "vmlinux not found" >&2; exit 1; }
          echo "vmlinux: $vmlinux ($(stat -c %s "$vmlinux") bytes)"

          "$OD" -d "$vmlinux" > /tmp/vmlinux.dis

          # The RLX5281 Taroko core lacks the MIPS conditional-trap family.
          # Any occurrence is a build-breaking bug: it traps RI on the device.
          forbidden='teq|tne|tge|tgeu|tlt|tltu'
          count=$(grep -cwE "$forbidden" /tmp/vmlinux.dis || true)

          if [ "$count" -gt 0 ]; then
            echo "FAIL: $count lines with forbidden trap instructions in vmlinux" >&2
            echo
            echo "By type:"
            grep -owE "$forbidden" /tmp/vmlinux.dis | sort | uniq -c | sort -rn
            echo
            echo "First 20 occurrences:"
            grep -nwE "$forbidden" /tmp/vmlinux.dis | head -20
            exit 1
          fi
          echo "OK: 0 trap instructions in vmlinux"

      # ---- Size and warning report ----

      - name: Kernel size and warnings
        run: |
          vmlinux=$(find build_dir/target-*/linux-*/linux-*/ -name vmlinux -type f 2>/dev/null | head -1)
          uimage=$(find build_dir/target-*/linux-*/linux-*/ -name uImage -type f 2>/dev/null | head -1)

          vmsize=$(stat -c %s "$vmlinux" 2>/dev/null || echo 0)
          usize=0
          [ -z "$uimage" ] || usize=$(stat -c %s "$uimage" 2>/dev/null || echo 0)

          # Smallest kernel partition across all taroko boards:
          # F6005 / X100DG: k0 = 2240k = 2293760 bytes
          smallest_k0=2293760

          warnings=$(grep -c "warning:" /tmp/kernel-build.log 2>/dev/null || true)

          {
            echo "### Kernel build — realtek-luna / taroko (RLX/Lexra)"
            echo
            echo "| | |"
            echo "|---|---:|"
            [ -z "${TOOLCHAIN_SECONDS:-}" ] || echo "| toolchain (cached) | ${TOOLCHAIN_SECONDS} s |"
            echo "| kernel build | ${KERNEL_SECONDS:-?} s |"
            echo "| vmlinux | ${vmsize} bytes |"
            if [ "$usize" -gt 0 ]; then
              echo "| uImage | ${usize} bytes |"
              echo "| smallest k0 (F6005) | ${smallest_k0} bytes |"
              spare=$((smallest_k0 - usize))
              echo "| spare | ${spare} bytes |"
            fi
            echo "| compiler warnings | ${warnings} |"
            echo "| ISA audit (trap insns) | **passed** |"
            echo
            echo "RLX/Lexra mitigations in \`taroko/target.mk\`:"
            echo '```'
            echo "-fno-schedule-insns2  Lexra MDU erratum: load in div/mult shadow corrupts HI/LO"
            echo "-mfix-rlx             branch delay slot + three-operand mul erratum"
            echo "-mdivide-breaks       break 7 instead of teq for divide-by-zero (no trap insns)"
            echo '```'
            if [ "$warnings" -gt 0 ]; then
              echo
              echo "<details><summary>Warnings, most frequent first (40 at most)</summary>"
              echo
              echo '```'
              { grep -o "[^ ]*: warning:.*" /tmp/kernel-build.log || true; } |
                sort | uniq -c | sort -rn | sed -n "1,40p"
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "vmlinux $vmsize, uImage ${usize:-n/a}, $warnings warnings"

          if [ "$usize" -gt 0 ] && [ "$usize" -gt "$smallest_k0" ]; then
            echo "FAIL: uImage ($usize bytes) exceeds smallest k0 partition ($smallest_k0 bytes)" >&2
            exit 1
          fi

      # ---- Full firmware ----

      - name: Build firmware
        run: |
          start=$(date +%s)
          make -j$(nproc) V=s 2>&1 | tee build.log | tail -100
          echo "FIRMWARE_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
        continue-on-error: true

      - name: Retry build (single thread on failure)
        if: failure()
        run: make -j1 V=s 2>&1 | tail -200

      - name: Collect firmware artifacts
        run: |
          mkdir -p firmware
          cp -v bin/targets/realtek-luna/taroko/*-initramfs-*.bin firmware/ 2>/dev/null || true
          cp -v bin/targets/realtek-luna/taroko/*-kernel.bin firmware/ 2>/dev/null || true
          cp -v bin/targets/realtek-luna/taroko/*-rootfs.bin firmware/ 2>/dev/null || true
          cp -v bin/targets/realtek-luna/taroko/*-sysupgrade.bin firmware/ 2>/dev/null || true
          cp -v bin/targets/realtek-luna/taroko/sha256sums firmware/ 2>/dev/null || true
          cp -v bin/targets/realtek-luna/taroko/profiles.json firmware/ 2>/dev/null || true
          ls -lh firmware/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: realtek-luna-taroko-firmware-${{ github.sha }}
          path: firmware/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: |
            /tmp/kernel-build.log
            build.log
          retention-days: 7

  release:
    name: Create release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: realtek-luna-taroko-firmware-${{ github.sha }}
          path: firmware/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: firmware/*
          generate_release_notes: true
